server {
    listen 80 default_server;
    server_name _;

    # Serve the React bundle. SPA fallback: any unmatched route returns
    # index.html so react-router can handle it client-side.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the FastAPI backend on the docker network.
    # Browser sees same-origin requests → no CORS preflight needed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The admin dashboard polls every 3s; default proxy_read_timeout
        # of 60s is fine.
    }

    # Cache the SPA bundle aggressively. Vite hashes file names on build
    # so cache-busting Just Works.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Light health endpoint for compose to know nginx is up.
    location = /nginx-health { return 200 "ok\n"; }
}
