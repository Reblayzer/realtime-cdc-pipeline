# Real-time CDC pipeline: Postgres → Debezium → Kafka → Spark → ClickHouse.
#
# Boot order (managed by depends_on + healthchecks):
#   1. postgres
#   2. zookeeper → kafka → kafka-connect (Debezium runs in here)
#   3. clickhouse
#   4. spark-job  (waits for kafka + clickhouse)
#   5. data-generator (waits for postgres)
#   6. jupyter (independent, just queries clickhouse)
#
# Every long-running service has a healthcheck so `docker compose up -d` only
# returns once the topology is actually ready. Spark won't try to read from
# Kafka before Kafka exists; the data-gen won't write before Postgres exists.

services:

  # ─── SOURCE DATABASE ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cdc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_connections=100
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdc_user} -d ${POSTGRES_DB:-shop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── DATA GENERATOR ─────────────────────────────────────────────────────────
  # Continuously writes inserts/updates/deletes to Postgres so we have CDC
  # traffic. Runs as a separate service (not a one-off) so you can scale it,
  # restart it, or kill it independently.
  data-generator:
    build: ./data-generator
    container_name: cdc-data-generator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-cdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_pass}
      OPS_PER_SECOND: "2.0"
      LOG_EVERY: "10"

  # ─── KAFKA STACK ────────────────────────────────────────────────────────────
  # Confluent's images are the canonical reference for Kafka + Connect.
  # We use Zookeeper mode (vs. KRaft) because Debezium examples target it most
  # often and because it's the lowest-risk path to a known-working topology.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cdc-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cdc-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker → single replica everywhere. Bump these in real clusters.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Kafka Connect runs Debezium's Postgres source connector as a plugin.
  kafka-connect:
    image: debezium/connect:2.6.2.Final
    container_name: cdc-kafka-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc-connect-cluster
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ─── WAREHOUSE ──────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: cdc-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickpass}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # clickhouse-client is shipped in the server image and uses the native
      # protocol; it works even when only IPv6 loopback is bound, which is the
      # default for ClickHouse and trips up wget/curl-based HTTP probes.
      test: ["CMD-SHELL", "clickhouse-client --password=${CLICKHOUSE_PASSWORD:-clickpass} --query='SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── STREAMING JOB ──────────────────────────────────────────────────────────
  # One container running spark-submit in local-mode. For a real cluster you'd
  # split this into spark-master + N spark-worker services, but local-mode is
  # what 99% of demo/CI setups use and removes a layer of irrelevant complexity.
  spark-job:
    build: ./spark
    container_name: cdc-spark-job
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_REGEX: "shop\\.public\\..*"
      KAFKA_START_OFFSETS: earliest
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickpass}
      CHECKPOINT_DIR: /opt/checkpoint
      TRIGGER_INTERVAL: "5 seconds"
    volumes:
      - ./spark/jobs:/opt/job:ro
      - spark-checkpoints:/opt/checkpoint
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - "local[*]"
      - --conf
      - spark.driver.memory=1g
      - --conf
      - spark.executor.memory=1g
      - /opt/job/cdc_to_clickhouse.py

  # ─── DEMO NOTEBOOK ──────────────────────────────────────────────────────────
  jupyter:
    image: jupyter/scipy-notebook:python-3.11
    container_name: cdc-jupyter
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: cdc
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_NATIVE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickpass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    volumes:
      - ./notebooks:/home/jovyan/work
    # Install clickhouse-driver on container start (small, idempotent).
    command: >
      bash -c "pip install --quiet --user clickhouse-driver==0.2.9 &&
               start-notebook.sh --NotebookApp.token=cdc --NotebookApp.notebook_dir=/home/jovyan/work"

volumes:
  postgres-data:
  clickhouse-data:
  spark-checkpoints:

networks:
  default:
    name: cdc-net
